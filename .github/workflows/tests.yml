name: SafeSignal checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install app and browser-test dependencies
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Compile Python sources
        run: python -m compileall -q app.py core db tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Evaluate synthetic corpus
        run: python tests/evaluate_corpus.py
      - name: Run Streamlit in Chromium and capture screenshots
        run: python tests/browser_smoke.py
      - name: Upload multilingual browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safesignal-streamlit-screenshots
          path: artifacts/streamlit/*.png
          if-no-files-found: warn
      - name: Check JSON translations
        run: python -c "import json, pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('i18n').glob('*.json')]; print('Translation JSON files are valid')"
